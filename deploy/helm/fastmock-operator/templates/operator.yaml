{{- $name := printf "%s-fastmock-operator" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $ns := .Values.watchNamespace -}}
{{- $roleKind := ternary "Role" "ClusterRole" (ne $ns "") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}
metadata:
  name: {{ $name }}
  {{- if $ns }}
  namespace: {{ $ns }}
  {{- end }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["fastmock.io"]
    resources: ["mockservers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fastmock.io"]
    resources: ["mockapis"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["fastmock.io"]
    resources: ["mockservers/status", "mockapis/status"]
    verbs: ["patch"]
  - apiGroups: ["fastmock.io"]
    resources: ["mockservers/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}Binding
metadata:
  name: {{ $name }}
  {{- if $ns }}
  namespace: {{ $ns }}
  {{- end }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleKind }}
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fastmock-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastmock-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ printf "%s,kube=warn,hyper=warn" .Values.logLevel | quote }}
            - name: FASTMOCK_OPERATOR_NAMESPACE
              value: {{ $ns | quote }}
            - name: FASTMOCK_OPERATOR_SERVER_IMAGE
              value: {{ printf "%s:%s" .Values.server.image.repository (default .Chart.AppVersion .Values.server.image.tag) | quote }}
            - name: FASTMOCK_OPERATOR_ALLOWED_IMAGE_PREFIXES
              value: {{ join "," .Values.server.allowedImagePrefixes | quote }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: fastmock-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fastmock-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
