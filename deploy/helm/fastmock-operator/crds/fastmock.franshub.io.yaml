---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fastmocks.fastmock.franshub.io
spec:
  group: fastmock.franshub.io
  names:
    kind: FastMock
    plural: fastmocks
    shortNames:
    - fm
    singular: fastmock
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.storage.mode
      name: Storage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FastMockSpec via `CustomResource`
        properties:
          spec:
            properties:
              access:
                description: 'Access control for the server: a ConfigMap with its access file.'
                nullable: true
                properties:
                  configMapRef:
                    description: The access file (custom roles, spaces, bindings), mounted read-only and passed as `FASTMOCK_ACCESS_FILE`.
                    properties:
                      key:
                        default: access.yaml
                        description: Key holding the access file.
                        type: string
                      name:
                        description: 'ConfigMap in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                required:
                - configMapRef
                type: object
              adminTokensSecret:
                nullable: true
                properties:
                  key:
                    default: tokens
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              env:
                additionalProperties:
                  type: string
                default: {}
                type: object
              image:
                type: string
              imagePullSecrets:
                default: []
                items:
                  type: string
                type: array
              oidc:
                description: SSO sign-in (OIDC) for the UI and bearer JWTs for the admin API.
                nullable: true
                properties:
                  allowedHosts:
                    description: Hosts besides the issuer's that the discovery document may point to.
                    items:
                      type: string
                    type: array
                  apiAudience:
                    description: Enables bearer JWTs on the admin API for this audience.
                    nullable: true
                    type: string
                  caConfigMapRef:
                    description: PEM bundle of extra CAs for the IdP connections, passed as `FASTMOCK_OIDC_CA_FILE`.
                    nullable: true
                    properties:
                      key:
                        default: ca.crt
                        type: string
                      name:
                        description: 'ConfigMap in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                  clientId:
                    type: string
                  clientSecretRef:
                    description: The client secret, mounted read-only and passed as `FASTMOCK_OIDC_CLIENT_SECRET_FILE`.
                    properties:
                      key:
                        default: client-secret
                        type: string
                      name:
                        description: 'Secret in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                  groupsClaim:
                    description: Default `groups`; dotted paths such as `realm_access.roles` work.
                    nullable: true
                    type: string
                  issuer:
                    description: Issuer URL (https); discovery from `/.well-known/openid-configuration`.
                    type: string
                  redirectUrl:
                    description: Public admin URL followed by `/__admin/auth/callback`.
                    type: string
                  scopes:
                    description: Default `openid profile email`.
                    items:
                      type: string
                    type: array
                  sessionIdle:
                    description: Idle timeout, default `1h`.
                    nullable: true
                    type: string
                  sessionTtl:
                    description: Absolute session lifetime, default `8h`.
                    nullable: true
                    type: string
                  usernameClaim:
                    description: Default `preferred_username`.
                    nullable: true
                    type: string
                required:
                - clientId
                - clientSecretRef
                - issuer
                - redirectUrl
                type: object
              otelEndpoint:
                nullable: true
                type: string
              pluginSettings:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                default: {}
                type: object
              plugins:
                default: []
                items:
                  type: string
                type: array
              replicas:
                default: 1
                format: int32
                type: integer
              resources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              route:
                nullable: true
                properties:
                  hostnames:
                    default: []
                    items:
                      type: string
                    type: array
                  parentRefs:
                    default: []
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                type: object
              secretsSecret:
                nullable: true
                type: string
              storage:
                default:
                  mode: memory
                properties:
                  database:
                    nullable: true
                    properties:
                      key:
                        default: url
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: memory
                    type: string
                  valkey:
                    nullable: true
                    properties:
                      key:
                        default: url
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  valkeyPrefix:
                    nullable: true
                    type: string
                type: object
            type: object
          status:
            nullable: true
            properties:
              adminUrl:
                default: ''
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dataUrl:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              readyReplicas:
                default: 0
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: FastMock
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mockapis.fastmock.franshub.io
spec:
  group: fastmock.franshub.io
  names:
    kind: MockApi
    plural: mockapis
    shortNames:
    - fmapi
    singular: mockapi
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.importedStubs
      name: Stubs
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MockApiSpec via `CustomResource`
        properties:
          spec:
            properties:
              openapi:
                nullable: true
                properties:
                  configMapRef:
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    nullable: true
                    type: string
                  pathPrefix:
                    default: ''
                    type: string
                  validateRequests:
                    default: true
                    type: boolean
                type: object
              serverRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              space:
                description: Space of the FastMock server the stubs go to; it must be defined in the server's access file. With the operator policy `spaceFromNamespace` the space is the MockApi namespace.
                nullable: true
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              stubs:
                default: []
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              tag:
                nullable: true
                type: string
              wiremock:
                nullable: true
                properties:
                  configMapRef:
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    nullable: true
                    type: string
                type: object
            required:
            - serverRef
            type: object
          status:
            nullable: true
            properties:
              appliedHash:
                default: ''
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              importedStubs:
                default: 0
                format: int64
                type: integer
              lastSyncTime:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              replacedInstance:
                description: |-
                  Instance id of the in-memory server process a restart replaces. While it is set, `Synced` stays
                  `False` with reason `ServerRestarting` until the stubs are confirmed on the new instance.
                nullable: true
                type: string
              serverInstance:
                description: |-
                  Instance id of the in-memory server process the stubs were imported into. A server that reports
                  another id has restarted and lost them, so they are imported again.
                type: string
              space:
                description: Space the stubs were applied to; absent for the global area.
                nullable: true
                type: string
              warnings:
                default: []
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        title: MockApi
        type: object
    served: true
    storage: true
    subresources:
      status: {}
