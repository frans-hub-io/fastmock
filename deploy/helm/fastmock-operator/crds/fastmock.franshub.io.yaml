---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fastmocks.fastmock.franshub.io
spec:
  group: fastmock.franshub.io
  names:
    kind: FastMock
    plural: fastmocks
    shortNames:
    - fm
    singular: fastmock
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.storage.mode
      name: Storage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FastMockSpec via `CustomResource`
        properties:
          spec:
            properties:
              access:
                description: 'Access control for the server: a ConfigMap with its access file.'
                nullable: true
                properties:
                  configMapRef:
                    description: The access file (custom roles, spaces, bindings), mounted read-only and passed as `FASTMOCK_ACCESS_FILE`.
                    properties:
                      key:
                        default: access.yaml
                        description: Key holding the access file.
                        type: string
                      name:
                        description: 'ConfigMap in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                required:
                - configMapRef
                type: object
              adminTokensSecret:
                nullable: true
                properties:
                  key:
                    default: tokens
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              env:
                additionalProperties:
                  type: string
                default: {}
                type: object
              image:
                type: string
              imagePullSecrets:
                default: []
                items:
                  type: string
                type: array
              mail:
                description: 'Mail capture: SMTP, IMAP and POP3 listeners with their Service.'
                nullable: true
                properties:
                  allowPlaintextAuth:
                    default: false
                    description: Offer AUTH/LOGIN before TLS even when a certificate is set.
                    type: boolean
                  enabled:
                    default: false
                    type: boolean
                  hostname:
                    description: Name in the SMTP greeting, default `localhost`.
                    nullable: true
                    pattern: ^[A-Za-z0-9.-]{1,253}$
                    type: string
                  limits:
                    description: Mail limits; unset values keep the server defaults.
                    nullable: true
                    properties:
                      idleTimeout:
                        description: '`FASTMOCK_MAIL_IDLE_TIMEOUT`, default `30s`.'
                        nullable: true
                        pattern: ^[0-9]+(ms|s|m|h|d)?$
                        type: string
                      imapIdleTimeout:
                        description: '`FASTMOCK_MAIL_IMAP_IDLE_TIMEOUT`, default `30m`.'
                        nullable: true
                        pattern: ^[0-9]+(ms|s|m|h|d)?$
                        type: string
                      loginFailureLimit:
                        description: |-
                          `FASTMOCK_MAIL_LOGIN_FAILURE_LIMIT`: failed logins per client address or user name within 5
                          minutes before logins are refused for a while, default 5; `0` turns this off.
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      maxAge:
                        description: '`FASTMOCK_MAIL_MAX_AGE`, default `7d`.'
                        nullable: true
                        pattern: ^[0-9]+(ms|s|m|h|d)?$
                        type: string
                      maxBytes:
                        description: |-
                          `FASTMOCK_MAIL_MAX_BYTES` of raw messages per space, default 268435456 (256 MiB); at least the
                          message size limit.
                        format: int64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxConnections:
                        description: '`FASTMOCK_MAIL_MAX_CONNECTIONS` over all mail listeners, default 256.'
                        format: int64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxConnectionsPerIp:
                        description: '`FASTMOCK_MAIL_MAX_CONNECTIONS_PER_IP`, default 32.'
                        format: int64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxMailboxes:
                        description: '`FASTMOCK_MAIL_MAX_MAILBOXES` per space, default 10000.'
                        format: int64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxMessageBytes:
                        description: '`FASTMOCK_MAIL_MAX_MESSAGE_BYTES`, default 10 MiB.'
                        format: int64
                        maximum: 536870912.0
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxMessages:
                        description: '`FASTMOCK_MAIL_MAX_MESSAGES` per space, default 1000.'
                        format: int64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      sessionTimeout:
                        description: '`FASTMOCK_MAIL_SESSION_TIMEOUT`, default `10m`.'
                        nullable: true
                        pattern: ^[0-9]+(ms|s|m|h|d)?$
                        type: string
                    type: object
                  ports:
                    default:
                      smtp: 2525
                      smtps: 0
                      imap: 0
                      imaps: 0
                      pop3: 0
                      pop3s: 0
                    description: Mail listener ports; `0` turns a listener off. Every port also goes into the `<name>-mail` Service.
                    properties:
                      imap:
                        default: 0
                        description: IMAP (with STARTTLS when a certificate is set).
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      imaps:
                        default: 0
                        description: IMAP with implicit TLS; needs `tlsSecretRef`.
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      pop3:
                        default: 0
                        description: POP3 (with STLS when a certificate is set).
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      pop3s:
                        default: 0
                        description: POP3 with implicit TLS; needs `tlsSecretRef`.
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      smtp:
                        default: 2525
                        description: SMTP (with STARTTLS when a certificate is set), default 2525.
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      smtps:
                        default: 0
                        description: SMTP with implicit TLS; needs `tlsSecretRef`.
                        format: int32
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                    type: object
                  requireAuth:
                    default: false
                    description: SMTP clients must authenticate (a user of `usersSecretRef` or a managed token with `mail:write`).
                    type: boolean
                  service:
                    description: The `<name>-mail` Service.
                    nullable: true
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      type:
                        description: '`ClusterIP` (default), `NodePort` or `LoadBalancer`.'
                        nullable: true
                        pattern: ^(ClusterIP|NodePort|LoadBalancer)$
                        type: string
                    type: object
                  tlsSecretRef:
                    description: Certificate for SMTPS/IMAPS/POP3S and STARTTLS/STLS, mounted read-only.
                    nullable: true
                    properties:
                      certKey:
                        default: tls.crt
                        description: Key of the PEM certificate chain, default `tls.crt`.
                        type: string
                      keyKey:
                        default: tls.key
                        description: Key of the PEM private key, default `tls.key`.
                        type: string
                      name:
                        description: 'Secret in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                  usersSecretRef:
                    description: SMTP users, passed as `FASTMOCK_MAIL_SMTP_USERS`.
                    nullable: true
                    properties:
                      key:
                        default: users
                        description: Key holding `user:sha256hex` entries (comma or newline separated), default `users`.
                        type: string
                      name:
                        description: 'Secret in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                type: object
              oidc:
                description: SSO sign-in (OIDC) for the UI and bearer JWTs for the admin API.
                nullable: true
                properties:
                  allowedHosts:
                    description: Hosts besides the issuer's that the discovery document may point to.
                    items:
                      type: string
                    type: array
                  apiAudience:
                    description: Enables bearer JWTs on the admin API for this audience.
                    nullable: true
                    type: string
                  caConfigMapRef:
                    description: PEM bundle of extra CAs for the IdP connections, passed as `FASTMOCK_OIDC_CA_FILE`.
                    nullable: true
                    properties:
                      key:
                        default: ca.crt
                        type: string
                      name:
                        description: 'ConfigMap in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                  clientId:
                    type: string
                  clientSecretRef:
                    description: The client secret, mounted read-only and passed as `FASTMOCK_OIDC_CLIENT_SECRET_FILE`.
                    properties:
                      key:
                        default: client-secret
                        type: string
                      name:
                        description: 'Secret in the namespace of the FastMock; it must carry the label `fastmock.franshub.io/allow-mount: "true"`.'
                        type: string
                    required:
                    - name
                    type: object
                  groupsClaim:
                    description: Default `groups`; dotted paths such as `realm_access.roles` work.
                    nullable: true
                    type: string
                  issuer:
                    description: Issuer URL (https); discovery from `/.well-known/openid-configuration`.
                    type: string
                  redirectUrl:
                    description: Public admin URL followed by `/__admin/auth/callback`.
                    type: string
                  scopes:
                    description: Default `openid profile email`.
                    items:
                      type: string
                    type: array
                  sessionIdle:
                    description: Idle timeout, default `1h`.
                    nullable: true
                    type: string
                  sessionTtl:
                    description: Absolute session lifetime, default `8h`.
                    nullable: true
                    type: string
                  usernameClaim:
                    description: Default `preferred_username`.
                    nullable: true
                    type: string
                required:
                - clientId
                - clientSecretRef
                - issuer
                - redirectUrl
                type: object
              otelEndpoint:
                nullable: true
                type: string
              pluginSettings:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                default: {}
                type: object
              plugins:
                default: []
                items:
                  type: string
                type: array
              replicas:
                default: 1
                format: int32
                type: integer
              resources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              route:
                nullable: true
                properties:
                  hostnames:
                    default: []
                    items:
                      type: string
                    type: array
                  parentRefs:
                    default: []
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                type: object
              secretsSecret:
                nullable: true
                type: string
              storage:
                default:
                  mode: memory
                properties:
                  database:
                    nullable: true
                    properties:
                      key:
                        default: url
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: memory
                    type: string
                  valkey:
                    nullable: true
                    properties:
                      key:
                        default: url
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  valkeyPrefix:
                    nullable: true
                    type: string
                type: object
            type: object
          status:
            nullable: true
            properties:
              adminUrl:
                default: ''
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dataUrl:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              readyReplicas:
                default: 0
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: FastMock
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mockapis.fastmock.franshub.io
spec:
  group: fastmock.franshub.io
  names:
    kind: MockApi
    plural: mockapis
    shortNames:
    - fmapi
    singular: mockapi
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.importedStubs
      name: Stubs
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MockApiSpec via `CustomResource`
        properties:
          spec:
            properties:
              openapi:
                nullable: true
                properties:
                  configMapRef:
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    nullable: true
                    type: string
                  pathPrefix:
                    default: ''
                    type: string
                  validateRequests:
                    default: true
                    type: boolean
                type: object
              serverRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              space:
                description: Space of the FastMock server the stubs go to; it must be defined in the server's access file. With the operator policy `spaceFromNamespace` the space is the MockApi namespace.
                nullable: true
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              stubs:
                default: []
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              tag:
                nullable: true
                type: string
              wiremock:
                nullable: true
                properties:
                  configMapRef:
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    nullable: true
                    type: string
                type: object
            required:
            - serverRef
            type: object
          status:
            nullable: true
            properties:
              appliedHash:
                default: ''
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              importedStubs:
                default: 0
                format: int64
                type: integer
              lastSyncTime:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              replacedInstance:
                description: |-
                  Instance id of the in-memory server process a restart replaces. While it is set, `Synced` stays
                  `False` with reason `ServerRestarting` until the stubs are confirmed on the new instance.
                nullable: true
                type: string
              serverInstance:
                description: |-
                  Instance id of the in-memory server process the stubs were imported into. A server that reports
                  another id has restarted and lost them, so they are imported again.
                type: string
              space:
                description: Space the stubs were applied to; absent for the global area.
                nullable: true
                type: string
              warnings:
                default: []
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        title: MockApi
        type: object
    served: true
    storage: true
    subresources:
      status: {}
