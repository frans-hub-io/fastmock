image:
  repository: fastmock-operator
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

server:
  image:
    repository: fastmock
    tag: ""
  allowedImagePrefixes: []

watchNamespace: ""

policy:
  spaceFromNamespace: false

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
