image:
  repository: fastmock
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

logFormat: json

plugins: []

pluginSettings: {}

extraEnv: []

admin:
  tokensSecret:
    name: ""
    key: tokens
  allowedOrigins: []
  uiDataPlaneUrls: []
  mcp:
    enabled: true

access:
  roles: []
  spaces: []
  bindings: []

oidc:
  issuer: ""
  clientId: ""
  clientSecret:
    existingSecret: ""
    key: client-secret
  redirectUrl: ""
  scopes: []
  claims:
    username: ""
    groups: ""
  apiAudience: ""
  trustOutboundCA: false
  session:
    ttl: 8h
    idle: 1h
  allowedHosts: []

callbacks:
  allowedHosts: []
  deniedCidrs: ""
  workers: 32
  timeout: 10s

secrets:
  existingSecret: ""
  stubSecrets: []
  contractSecrets: {}

outboundCA:
  configMap: ""
  key: ca.crt

journal:
  retention: 24h
  maxBodyBytes: 65536
  queue: 2048
  scanTimeout: 10s
  scanMaxWork: 4294967296
  scanConcurrency: 2

limits:
  maxBodyBytes: 10485760
  maxInflightBodyBytes: 134217728
  maxDelay: 15m
  recordingMaxStubs: 1000
  headerReadTimeout: 30s

messaging:
  kafka:
    bootstrap: []
    securityProtocol: ""
    sasl:
      mechanism: ""
      username: ""
      existingSecret: ""
      passwordKey: password
    tls:
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""
    schemaRegistry:
      url: ""
      username: ""
      existingSecret: ""
      passwordKey: password
    allowedTopics: []
    contractTopics: []
    createTopics:
      enabled: false
      partitions: 1
      replication: -1

mail:
  enabled: false
  hostname: ""
  ports:
    smtp: 2525
    smtps: ""
    imap: ""
    imaps: ""
    pop3: ""
    pop3s: ""
  tls:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
  requireAuth: false
  smtpUsers:
    existingSecret: ""
    key: users
  allowPlaintextAuth: false
  limits:
    maxMessageBytes: 10485760
    maxRecipients: 100
    maxMessages: 1000
    maxBytes: 268435456
    maxMailboxes: 10000
    maxAge: 7d
    maxConnections: 256
    maxConnectionsPerIp: 32
    maxAuthFailures: 3
    loginFailureLimit: 5
    idleTimeout: 30s
    dataTimeout: 60s
    sessionTimeout: 10m
    imapIdleTimeout: 30m
  service:
    type: ClusterIP
    annotations: {}

shutdownDelay: 5s
terminationGracePeriodSeconds: 45

storage:
  mode: postgres
  database:
    existingSecret: ""
    secretKey: database-url
    maxConnections: 10
    migrations:
      mode: auto
      timeout: 120s
      job:
        existingSecret: ""
        secretKey: database-url
        backoffLimit: 2
        activeDeadlineSeconds: 900
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
    tls:
      mode: ""
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""
  valkey:
    existingSecret: ""
    secretKey: valkey-url
    prefix: "fastmock:"
    username: ""
    tls:
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""

postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: postgres
    tag: "18.7-trixie"
    imagePullPolicy: IfNotPresent
  auth:
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
  customUser:
    name: fastmock
    database: fastmock
    existingSecret: ""
    secretKeys:
      name: ""
      database: ""
      password: password
  persistence:
    size: 10Gi
    storageClass: ""
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

cnpg:
  enabled: false
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
    storage:
      size: 10Gi
      storageClass: ""
    enableSuperuserAccess: false
    initdb:
      database: fastmock
      owner: fastmock
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  backups:
    enabled: false

valkey:
  enabled: false
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "9.1.4-trixie"
  auth:
    enabled: true
    usersExistingSecret: ""
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  deploymentStrategy: Recreate
  valkeyConfig: |
    appendonly yes
    appendfsync everysec
    maxmemory 256mb
    maxmemory-policy volatile-lru
  readinessProbe:
    enabled: true
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  dataStorage:
    enabled: true
    requestedSize: 2Gi
    className: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

kafka:
  enabled: false
  image:
    registry: docker.io
    repository: apache/kafka
    tag: "4.4.0"
    imagePullPolicy: IfNotPresent
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  heapOpts: "-Xmx512m -Xms512m"
  kafkaConfig:
    numPartitions: 3
    defaultReplicationFactor: 1
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    autoCreateTopicsEnable: true
  auth:
    client:
      enabled: true
    interBroker:
      enabled: true
    controller:
      enabled: true
    clientUser: fastmock
    existingSecret: ""
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

otel:
  endpoint: ""
  protocol: http/protobuf
  serviceName: fastmock
  resourceAttributes: ""

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090
  annotations: {}

route:
  enabled: false
  hostnames: []
  parentRefs: []
  admin:
    enabled: false
    hostnames: []
    parentRefs: []

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    unmatchedRatio: 0.2
    callbackBacklog: 1000

networkPolicy:
  enabled: false
  adminFrom: []
  dataFrom: []
  mailFrom: []
  storage: true
  egress:
    enabled: false
    rules: []

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

startupProbe:
  periodSeconds: 2
  failureThreshold: 60

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "2"
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
