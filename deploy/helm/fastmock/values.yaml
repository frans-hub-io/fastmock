image:
  repository: fastmock
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

logFormat: json

plugins: []

pluginSettings: {}

extraEnv: []

admin:
  tokensSecret:
    name: ""
    key: tokens
  allowedOrigins: []
  uiDataPlaneUrls: []

callbacks:
  allowedHosts: []
  deniedCidrs: ""
  workers: 32
  timeout: 10s

secrets:
  existingSecret: ""
  stubSecrets: []
  contractSecrets: {}

outboundCA:
  configMap: ""
  key: ca.crt

journal:
  retention: 24h
  maxBodyBytes: 65536
  queue: 2048
  scanTimeout: 10s
  scanMaxWork: 4294967296
  scanConcurrency: 2

limits:
  maxBodyBytes: 10485760
  maxInflightBodyBytes: 134217728
  maxDelay: 15m
  recordingMaxStubs: 1000
  headerReadTimeout: 30s

messaging:
  kafka:
    bootstrap: []
    securityProtocol: ""
    sasl:
      mechanism: ""
      username: ""
      existingSecret: ""
      passwordKey: password
    tls:
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""
    schemaRegistry:
      url: ""
      username: ""
      existingSecret: ""
      passwordKey: password
    allowedTopics: []
    contractTopics: []

shutdownDelay: 5s
terminationGracePeriodSeconds: 45

storage:
  mode: postgres
  database:
    existingSecret: ""
    secretKey: database-url
    maxConnections: 10
    tls:
      mode: ""
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""
  valkey:
    existingSecret: ""
    secretKey: valkey-url
    prefix: "fastmock:"
    username: ""
    tls:
      caSecret: ""
      caKey: ca.crt
      clientCertSecret: ""

postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: postgres
    tag: "18.7-trixie"
    imagePullPolicy: IfNotPresent
  auth:
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
  customUser:
    name: fastmock
    database: fastmock
    existingSecret: ""
    secretKeys:
      name: ""
      database: ""
      password: password
  persistence:
    size: 10Gi
    storageClass: ""
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

cnpg:
  enabled: false
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
    storage:
      size: 10Gi
      storageClass: ""
    enableSuperuserAccess: false
    initdb:
      database: fastmock
      owner: fastmock
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  backups:
    enabled: false

valkey:
  enabled: false
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "9.1.4-trixie"
  auth:
    enabled: true
    usersExistingSecret: ""
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  deploymentStrategy: Recreate
  valkeyConfig: |
    appendonly yes
    appendfsync everysec
    maxmemory 256mb
    maxmemory-policy volatile-lru
  readinessProbe:
    enabled: true
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  dataStorage:
    enabled: true
    requestedSize: 2Gi
    className: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

kafka:
  enabled: false
  image:
    registry: docker.io
    repository: apache/kafka
    tag: "4.4.0"
    imagePullPolicy: IfNotPresent
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  heapOpts: "-Xmx512m -Xms512m"
  kafkaConfig:
    numPartitions: 3
    defaultReplicationFactor: 1
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    autoCreateTopicsEnable: true
  auth:
    client:
      enabled: true
    interBroker:
      enabled: true
    controller:
      enabled: true
    clientUser: fastmock
    existingSecret: ""
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

otel:
  endpoint: ""
  protocol: http/protobuf
  serviceName: fastmock
  resourceAttributes: ""

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090
  annotations: {}

route:
  enabled: false
  hostnames: []
  parentRefs: []
  admin:
    enabled: false
    hostnames: []
    parentRefs: []

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    unmatchedRatio: 0.2
    callbackBacklog: 1000

networkPolicy:
  enabled: false
  adminFrom: []
  dataFrom: []
  storage: true
  egress:
    enabled: false
    rules: []

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "2"
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
