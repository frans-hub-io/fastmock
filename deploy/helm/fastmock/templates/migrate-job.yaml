{{- if and (eq .Values.storage.mode "postgres") (eq .Values.storage.database.migrations.mode "job") }}
{{- $fullname := include "fastmock.fullname" . -}}
{{- $job := .Values.storage.database.migrations.job -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "fastmock.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "fastmock.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $job.backoffLimit }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "fastmock.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-migrate
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "fastmock.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: FASTMOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.storage.database.existingSecret $job.existingSecret }}
                  key: {{ ternary $job.secretKey .Values.storage.database.secretKey (not (empty $job.existingSecret)) }}
            - name: FASTMOCK_DATABASE_MIGRATION_TIMEOUT
              value: {{ .Values.storage.database.migrations.timeout | quote }}
            {{- with .Values.storage.database.tls.mode }}
            - name: FASTMOCK_DATABASE_SSL_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.storage.database.tls.caSecret }}
            - name: FASTMOCK_DATABASE_SSL_ROOT_CERT
              value: /etc/fastmock/tls/database-ca/ca.crt
            {{- end }}
            {{- if .Values.storage.database.tls.clientCertSecret }}
            - name: FASTMOCK_DATABASE_SSL_CERT
              value: /etc/fastmock/tls/database-client/tls.crt
            - name: FASTMOCK_DATABASE_SSL_KEY
              value: /etc/fastmock/tls/database-client/tls.key
            {{- end }}
          resources:
            {{- toYaml $job.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.storage.database.tls.caSecret }}
            - name: tls-database-ca
              mountPath: /etc/fastmock/tls/database-ca
              readOnly: true
            {{- end }}
            {{- if .Values.storage.database.tls.clientCertSecret }}
            - name: tls-database-client
              mountPath: /etc/fastmock/tls/database-client
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.storage.database.tls.caSecret }}
        - name: tls-database-ca
          secret:
            secretName: {{ .Values.storage.database.tls.caSecret }}
            items:
              - key: {{ .Values.storage.database.tls.caKey }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if .Values.storage.database.tls.clientCertSecret }}
        - name: tls-database-client
          secret:
            secretName: {{ .Values.storage.database.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
{{- end }}
