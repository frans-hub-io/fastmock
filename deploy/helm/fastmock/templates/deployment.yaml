{{- $fullname := include "fastmock.fullname" . -}}
{{- if eq .Values.storage.mode "postgres" }}
{{- if and .Values.postgresql.enabled .Values.cnpg.enabled }}
{{- fail "enable only one of postgresql.enabled and cnpg.enabled" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.cnpg.enabled) (not .Values.storage.database.existingSecret) }}
{{- fail "PostgreSQL is required in postgres mode: set postgresql.enabled, cnpg.enabled or storage.database.existingSecret" }}
{{- end }}
{{- if and .Values.cnpg.enabled (not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1")) }}
{{- fail "cnpg.enabled needs the CloudNativePG operator: install it first (https://cloudnative-pg.io/documentation/current/installation_upgrade/)" }}
{{- end }}
{{- if and (not .Values.valkey.enabled) (not .Values.storage.valkey.existingSecret) }}
{{- fail "Valkey is required in postgres mode: set valkey.enabled or storage.valkey.existingSecret" }}
{{- end }}
{{- end }}
{{- if and .Values.kafka.enabled .Values.messaging.kafka.bootstrap }}
{{- fail "set either kafka.enabled or messaging.kafka.bootstrap, not both" }}
{{- end }}
{{- if and .Values.messaging.kafka.sasl.mechanism (not .Values.messaging.kafka.sasl.existingSecret) }}
{{- fail "messaging.kafka.sasl.existingSecret is required when messaging.kafka.sasl.mechanism is set" }}
{{- end }}
{{- if and .Values.messaging.kafka.schemaRegistry.username (not .Values.messaging.kafka.schemaRegistry.existingSecret) }}
{{- fail "messaging.kafka.schemaRegistry.existingSecret is required when messaging.kafka.schemaRegistry.username is set" }}
{{- end }}
{{- if and (eq .Values.storage.database.migrations.mode "job") (or .Values.postgresql.enabled .Values.cnpg.enabled) }}
{{- fail "storage.database.migrations.mode=job needs an external database: the databases installed with the release do not exist yet when the migration Job runs" }}
{{- end }}
{{- $oidc := .Values.oidc | default dict }}
{{- $oidcSecret := $oidc.clientSecret | default dict }}
{{- if and (not .Values.admin.tokensSecret.name) (not $oidc.issuer) }}
{{- fail "admin.tokensSecret.name or oidc.issuer is required: FastMock never runs without admin authentication" }}
{{- end }}
{{- if $oidc.issuer }}
{{- if not $oidc.clientId }}
{{- fail "oidc.clientId is required when oidc.issuer is set" }}
{{- end }}
{{- if not $oidcSecret.existingSecret }}
{{- fail "oidc.clientSecret.existingSecret is required when oidc.issuer is set: a Secret holding the client secret" }}
{{- end }}
{{- if not $oidc.redirectUrl }}
{{- fail "oidc.redirectUrl is required when oidc.issuer is set: the public admin URL followed by /__admin/auth/callback" }}
{{- end }}
{{- if and $oidc.trustOutboundCA (not .Values.outboundCA.configMap) }}
{{- fail "oidc.trustOutboundCA needs outboundCA.configMap" }}
{{- end }}
{{- end }}
{{- include "fastmock.mailValidate" . }}
{{- include "fastmock.brokersValidate" . }}
{{- $mqtt := .Values.messaging.mqtt }}
{{- $amqp := .Values.messaging.amqp }}
{{- $mail := .Values.mail | default dict }}
{{- $mailTls := and $mail.enabled (dig "tls" "existingSecret" "" $mail) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "fastmock.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "fastmock.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "fastmock.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "fastmock.accessEnabled" . }}
        checksum/access: {{ include (print $.Template.BasePath "/access.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "fastmock.captureSourcesEnabled" . }}
        checksum/capture: {{ include (print $.Template.BasePath "/capture.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fastmock.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: fastmock
          image: {{ include "fastmock.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
          env:
            {{- if .Values.outboundCA.configMap }}
            - name: FASTMOCK_OUTBOUND_CA_FILE
              value: /etc/fastmock/outbound-ca/ca.crt
            {{- end }}
            {{- if eq .Values.storage.mode "postgres" }}
            {{- if .Values.postgresql.enabled }}
            - name: FASTMOCK_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql.customUser.existingSecret is required" .Values.postgresql.customUser.existingSecret }}
                  key: {{ .Values.postgresql.customUser.secretKeys.password }}
            - name: FASTMOCK_DATABASE_URL
              value: {{ printf "postgres://%s@%s:5432/%s" .Values.postgresql.customUser.name (include "fastmock.dependencyFullname" (dict "root" . "name" "postgresql")) .Values.postgresql.customUser.database | quote }}
            {{- else if .Values.cnpg.enabled }}
            - name: FASTMOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-app" (include "fastmock.dependencyFullname" (dict "root" . "name" "cnpg")) }}
                  key: uri
            {{- else }}
            - name: FASTMOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.database.existingSecret }}
                  key: {{ .Values.storage.database.secretKey }}
            {{- end }}
            {{- if .Values.valkey.enabled }}
            - name: FASTMOCK_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "valkey.auth.usersExistingSecret is required" .Values.valkey.auth.usersExistingSecret }}
                  key: {{ .Values.valkey.auth.aclUsers.default.passwordKey | default "default" }}
            - name: FASTMOCK_VALKEY_URL
              value: {{ printf "redis://%s:6379/" (include "fastmock.dependencyFullname" (dict "root" . "name" "valkey")) | quote }}
            {{- else }}
            - name: FASTMOCK_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.valkey.existingSecret }}
                  key: {{ .Values.storage.valkey.secretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: FASTMOCK_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "fastmock.dependencyFullname" (dict "root" . "name" "kafka")) .Values.kafka.auth.existingSecret }}
                  key: client-password
            {{- else if .Values.messaging.kafka.sasl.existingSecret }}
            - name: FASTMOCK_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.messaging.kafka.sasl.existingSecret }}
                  key: {{ .Values.messaging.kafka.sasl.passwordKey }}
            {{- end }}
            {{- with .Values.messaging.kafka.schemaRegistry.existingSecret }}
            - name: FASTMOCK_KAFKA_SCHEMA_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.messaging.kafka.schemaRegistry.passwordKey }}
            {{- end }}
            {{- if and $mqtt.url $mqtt.existingSecret }}
            - name: FASTMOCK_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mqtt.existingSecret }}
                  key: {{ $mqtt.passwordKey }}
            {{- end }}
            {{- if and $amqp.url $amqp.sasl.existingSecret }}
            - name: FASTMOCK_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $amqp.sasl.existingSecret }}
                  key: {{ $amqp.sasl.passwordKey }}
            {{- end }}
            {{- if and $mail.enabled (dig "smtpUsers" "existingSecret" "" $mail) }}
            - name: FASTMOCK_MAIL_SMTP_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ $mail.smtpUsers.existingSecret }}
                  key: {{ $mail.smtpUsers.key | default "users" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
            {{- range include "fastmock.mailListeners" . | fromJsonArray }}
            - name: {{ .name }}
              containerPort: {{ int .port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.admin.tokensSecret.name }}
            - name: admin-tokens
              mountPath: /etc/fastmock/admin
              readOnly: true
            {{- end }}
            {{- if $oidc.issuer }}
            - name: oidc
              mountPath: /etc/fastmock/oidc
              readOnly: true
            {{- end }}
            {{- if include "fastmock.accessEnabled" . }}
            - name: access
              mountPath: /etc/fastmock/access
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.existingSecret }}
            - name: secrets
              mountPath: /etc/fastmock/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.outboundCA.configMap }}
            - name: outbound-ca
              mountPath: /etc/fastmock/outbound-ca
              readOnly: true
            {{- end }}
            {{- if (and (eq .Values.storage.mode "postgres") (include "fastmock.databaseCaSecret" .)) }}
            - name: tls-database-ca
              mountPath: /etc/fastmock/tls/database-ca
              readOnly: true
            {{- end }}
            {{- if (and (eq .Values.storage.mode "postgres") .Values.storage.database.tls.clientCertSecret) }}
            - name: tls-database-client
              mountPath: /etc/fastmock/tls/database-client
              readOnly: true
            {{- end }}
            {{- if (and (eq .Values.storage.mode "postgres") (not .Values.valkey.enabled) .Values.storage.valkey.tls.caSecret) }}
            - name: tls-valkey-ca
              mountPath: /etc/fastmock/tls/valkey-ca
              readOnly: true
            {{- end }}
            {{- if (and (eq .Values.storage.mode "postgres") (not .Values.valkey.enabled) .Values.storage.valkey.tls.clientCertSecret) }}
            - name: tls-valkey-client
              mountPath: /etc/fastmock/tls/valkey-client
              readOnly: true
            {{- end }}
            {{- if (and (not .Values.kafka.enabled) .Values.messaging.kafka.tls.caSecret) }}
            - name: tls-kafka-ca
              mountPath: /etc/fastmock/tls/kafka-ca
              readOnly: true
            {{- end }}
            {{- if (and (not .Values.kafka.enabled) .Values.messaging.kafka.tls.clientCertSecret) }}
            - name: tls-kafka-client
              mountPath: /etc/fastmock/tls/kafka-client
              readOnly: true
            {{- end }}
            {{- if and $mqtt.url $mqtt.tls.caSecret }}
            - name: tls-mqtt-ca
              mountPath: /etc/fastmock/tls/mqtt-ca
              readOnly: true
            {{- end }}
            {{- if and $mqtt.url $mqtt.tls.clientCertSecret }}
            - name: tls-mqtt-client
              mountPath: /etc/fastmock/tls/mqtt-client
              readOnly: true
            {{- end }}
            {{- if and $mqtt.url (regexMatch "^(mqtts|ssl|tls)://" $mqtt.url) }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if and $amqp.url $amqp.tls.caSecret }}
            - name: tls-amqp-ca
              mountPath: /etc/fastmock/tls/amqp-ca
              readOnly: true
            {{- end }}
            {{- if and $amqp.url $amqp.tls.clientCertSecret }}
            - name: tls-amqp-client
              mountPath: /etc/fastmock/tls/amqp-client
              readOnly: true
            {{- end }}
            {{- if include "fastmock.captureSourcesEnabled" . }}
            - name: capture-sources
              mountPath: /etc/fastmock/capture
              readOnly: true
            {{- end }}
            {{- if $mailTls }}
            - name: tls-mail
              mountPath: /etc/fastmock/tls/mail
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.admin.tokensSecret.name }}
        - name: admin-tokens
          secret:
            secretName: {{ .Values.admin.tokensSecret.name }}
            items:
              - key: {{ .Values.admin.tokensSecret.key }}
                path: tokens
            defaultMode: 0440
        {{- end }}
        {{- if $oidc.issuer }}
        - name: oidc
          secret:
            secretName: {{ $oidcSecret.existingSecret }}
            items:
              - key: {{ $oidcSecret.key | default "client-secret" }}
                path: client-secret
            defaultMode: 0440
        {{- end }}
        {{- if include "fastmock.accessEnabled" . }}
        - name: access
          configMap:
            name: {{ include "fastmock.fullname" . }}-access
            items:
              - key: access.yaml
                path: access.yaml
        {{- end }}
        {{- if .Values.secrets.existingSecret }}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.outboundCA.configMap }}
        - name: outbound-ca
          configMap:
            name: {{ .Values.outboundCA.configMap }}
            items:
              - key: {{ .Values.outboundCA.key }}
                path: ca.crt
        {{- end }}
        {{- if (and (eq .Values.storage.mode "postgres") (include "fastmock.databaseCaSecret" .)) }}
        - name: tls-database-ca
          secret:
            secretName: {{ include "fastmock.databaseCaSecret" . }}
            items:
              - key: {{ include "fastmock.databaseCaKey" . }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if (and (eq .Values.storage.mode "postgres") .Values.storage.database.tls.clientCertSecret) }}
        - name: tls-database-client
          secret:
            secretName: {{ .Values.storage.database.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
        {{- if (and (eq .Values.storage.mode "postgres") (not .Values.valkey.enabled) .Values.storage.valkey.tls.caSecret) }}
        - name: tls-valkey-ca
          secret:
            secretName: {{ .Values.storage.valkey.tls.caSecret }}
            items:
              - key: {{ .Values.storage.valkey.tls.caKey }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if (and (eq .Values.storage.mode "postgres") (not .Values.valkey.enabled) .Values.storage.valkey.tls.clientCertSecret) }}
        - name: tls-valkey-client
          secret:
            secretName: {{ .Values.storage.valkey.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
        {{- if (and (not .Values.kafka.enabled) .Values.messaging.kafka.tls.caSecret) }}
        - name: tls-kafka-ca
          secret:
            secretName: {{ .Values.messaging.kafka.tls.caSecret }}
            items:
              - key: {{ .Values.messaging.kafka.tls.caKey }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if (and (not .Values.kafka.enabled) .Values.messaging.kafka.tls.clientCertSecret) }}
        - name: tls-kafka-client
          secret:
            secretName: {{ .Values.messaging.kafka.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
        {{- if and $mqtt.url $mqtt.tls.caSecret }}
        - name: tls-mqtt-ca
          secret:
            secretName: {{ $mqtt.tls.caSecret }}
            items:
              - key: {{ $mqtt.tls.caKey }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if and $mqtt.url $mqtt.tls.clientCertSecret }}
        - name: tls-mqtt-client
          secret:
            secretName: {{ $mqtt.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
        {{- if and $mqtt.url (regexMatch "^(mqtts|ssl|tls)://" $mqtt.url) }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if and $amqp.url $amqp.tls.caSecret }}
        - name: tls-amqp-ca
          secret:
            secretName: {{ $amqp.tls.caSecret }}
            items:
              - key: {{ $amqp.tls.caKey }}
                path: ca.crt
            defaultMode: 0440
        {{- end }}
        {{- if and $amqp.url $amqp.tls.clientCertSecret }}
        - name: tls-amqp-client
          secret:
            secretName: {{ $amqp.tls.clientCertSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0440
        {{- end }}
        {{- if include "fastmock.captureSourcesEnabled" . }}
        - name: capture-sources
          configMap:
            name: {{ include "fastmock.fullname" . }}-capture
            items:
              - key: sources.json
                path: sources.json
        {{- end }}
        {{- if $mailTls }}
        - name: tls-mail
          secret:
            secretName: {{ $mail.tls.existingSecret }}
            items:
              - key: {{ $mail.tls.certKey | default "tls.crt" }}
                path: tls.crt
              - key: {{ $mail.tls.keyKey | default "tls.key" }}
                path: tls.key
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
