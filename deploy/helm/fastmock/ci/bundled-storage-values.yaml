admin:
  tokensSecret:
    name: fastmock-admin-tokens

storage:
  mode: postgres

postgresql:
  enabled: true
  auth:
    existingSecret: fastmock-postgresql
  customUser:
    existingSecret: fastmock-postgresql

valkey:
  enabled: true
  auth:
    usersExistingSecret: fastmock-valkey

networkPolicy:
  enabled: true
  egress:
    enabled: true
