apiVersion: v2
name: fastmock
description: FastMock API mock server with durable callbacks, shared state in PostgreSQL and Valkey, and full observability
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
annotations:
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: postgres
    alias: postgresql
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgresql.enabled
  - name: cluster
    alias: cnpg
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
  - name: kafka
    version: 0.3.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: kafka.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
