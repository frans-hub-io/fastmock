[package]
name = "fastmock-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastmock"
path = "src/main.rs"

[features]
default = []

[dependencies]
rust-embed = { version = "8.11", features = ["debug-embed"] }
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
fastmock-core.workspace = true
fastmock-kafka.workspace = true
apache-avro.workspace = true
fastmock-store.workspace = true
futures = "0.3"
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
prost-reflect.workspace = true
prost.workspace = true
regex.workspace = true
aho-corasick = "1.1"
ipnet = "2.12"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
rand.workspace = true
ring = "0.17"
rustls.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.34"
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
utoipa.workspace = true
serde_json_path.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
async-trait.workspace = true
prost-types = "0.14"
hyper-util = { workspace = true, features = ["client-legacy", "http2"] }
rskafka.workspace = true
fastmock-kafka.workspace = true
apache-avro.workspace = true
rcgen = { version = "0.14", features = ["pem"] }
reqwest = { workspace = true, features = ["http2"] }
tokio = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
tokio-tungstenite = "0.29"
