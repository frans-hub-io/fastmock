apiVersion: mocks.microcks.io/v1alpha1
kind: APIMetadata
metadata:
  name: API Pastry - 2.0
  version: 2.0.0
  labels:
    team: pastry
    status: GA
operations:
  'GET /pastry/{name}':
    delay: 25
    dispatcher: FALLBACK
    dispatcherRules: |-
      {"dispatcher": "URI_PARTS", "dispatcherRules": "name", "fallback": "Unknown"}
  'GET /pastry':
    dispatcher: URI_PARAMS
    dispatcherRules: size
