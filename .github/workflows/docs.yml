name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - ui/package.json
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - ui/package.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MKDOCS_MATERIAL_VERSION: 9.8.0
  WRANGLER_VERSION: 4.157.0
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.5
      - name: install mkdocs
        run: pip install "mkdocs-material==${MKDOCS_MATERIAL_VERSION}"
      - name: vendor swagger-ui
        run: |
          version=$(node -p "require('./ui/package.json').dependencies['swagger-ui-dist']")
          tmp=$(mktemp -d)
          npm pack --silent --pack-destination "$tmp" "swagger-ui-dist@${version}"
          tar -xzf "$tmp"/swagger-ui-dist-*.tgz -C "$tmp"
          mkdir -p docs/api/swagger/vendor
          cp "$tmp/package/swagger-ui.css" "$tmp/package/swagger-ui-bundle.js" docs/api/swagger/vendor/
      - name: build
        run: mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site
          path: site
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs
      url: https://fastmock.franshub.io/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy site --project-name=fastmock --branch=main --commit-hash=${{ github.sha }}
