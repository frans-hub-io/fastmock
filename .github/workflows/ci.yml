name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: 1.100.0
  NODE_VERSION: 22.23.5

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  rust:
    name: rust (postgres ${{ matrix.postgres }}, ${{ matrix.kv }}, kafka ${{ matrix.kafka }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 18.7-trixie
            kv: valkey/valkey:9.1.4-trixie
            kvcli: valkey-cli
            kafka: 4.4.0
            lint: true
          - postgres: 16.16-trixie
            kv: valkey/valkey:8.1.12-trixie
            kvcli: valkey-cli
            kafka: 3.9.2
            lint: false
          - postgres: 14.25-trixie
            kv: redis:7.4.12
            kvcli: redis-cli
            kafka: 3.9.2
            lint: false
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: ${{ matrix.kv }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.kvcli }} ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:${{ matrix.kafka }}
        ports:
          - 9092:9092
    env:
      FASTMOCK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      FASTMOCK_TEST_VALKEY_URL: redis://localhost:6379/
      FASTMOCK_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - if: matrix.lint
        run: cargo fmt --all -- --check
      - if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.17.4
      - name: fetch chart dependencies
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build deploy/helm/fastmock
      - name: lint and render fastmock
        run: |
          for f in deploy/helm/fastmock/ci/*.yaml; do
            echo "::group::$f"
            if [ "$(basename "$f")" != cnpg-values.yaml ]; then
              helm lint --strict deploy/helm/fastmock -f "$f"
            fi
            helm template fastmock deploy/helm/fastmock -f "$f" --api-versions postgresql.cnpg.io/v1 > /dev/null
            echo "::endgroup::"
          done
      - name: lint and render fastmock-operator
        run: |
          helm lint --strict deploy/helm/fastmock-operator
          helm template fastmock-operator deploy/helm/fastmock-operator > /dev/null
          helm lint --strict deploy/helm/fastmock-operator --set policy=null
          helm template fastmock-operator deploy/helm/fastmock-operator --set policy=null > /dev/null

  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: 9.9.1
      - run: gradle --no-daemon build
